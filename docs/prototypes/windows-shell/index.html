<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Windows 外壳原型</title><style>body{font-family:system-ui,'Microsoft YaHei UI',sans-serif;margin:24px;background:#f4f5f7;color:#222}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}figure{margin:0;background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}img{width:100%;border-radius:6px;display:block}figcaption{margin-top:8px;font-size:14px;line-height:1.6}a{color:#0066cf}</style></head><body>
<h2>Windows 窗口外壳: 标题栏 + 左侧栏 + 上半部</h2><p>视口 1177×625 (Win10 1080p·150% 实际大小)。点标题打开可交互原型 (右上角可切深色)。推荐 <b>B 侧栏到顶</b>。</p><div class="g">
<figure><a href="0-现状.html"><img src="shots/0-现状.png" alt="0-现状.html"></a><figcaption><a href="0-现状.html"><b>0-现状</b></a><br>当前 r2 版本: 独立白色标题条 + 居中重复品牌名, 侧栏从标题条下开始, 白底侧栏与主区靠一条细线分开</figcaption></figure>
<figure><a href="A-一体标题栏.html"><img src="shots/A-一体标题栏.png" alt="A-一体标题栏.html"></a><figcaption><a href="A-一体标题栏.html"><b>A-一体标题栏</b></a><br>Windows 11 设置 / 资源管理器: 标题栏与侧栏同一块浅灰底 (Mica 感), 品牌在左上角只出现一次; 内容区是左上圆角的白色面板嵌在里面; 页面标题行收紧</figcaption></figure>
<figure><a href="B-侧栏到顶.html"><img src="shots/B-侧栏到顶.png" alt="B-侧栏到顶.html"></a><figcaption><a href="B-侧栏到顶.html"><b>B-侧栏到顶</b></a><br>macOS 访达 / Notion / Linear: 没有标题条, 侧栏直通到顶 (浅灰), 品牌放在侧栏顶部; 主区顶部那一行既是拖动区也是页面标题行, 窗口按钮贴在右上角; 纵向空间最省</figcaption></figure>
<figure><a href="C-标题栏搜索.html"><img src="shots/C-标题栏搜索.png" alt="C-标题栏搜索.html"></a><figcaption><a href="C-标题栏搜索.html"><b>C-标题栏搜索</b></a><br>Outlook / Teams / 资源管理器: 标题栏中间放全局搜索 (藏书·论文·书源一处搜), 品牌在最左; 侧栏紧凑, 与标题栏同色; 页面标题行只剩标题和添加</figcaption></figure>
</div></body></html>
