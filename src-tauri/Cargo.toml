[package]
name = "lightread"
version = "2.10.0"
description = "LightRead 轻阅 — 开源本地阅读器"
authors = ["云中江树"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.87.0"

[lib]
name = "lightread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["local-llm"]
# 本机模型 (llama.cpp, src/local_llm): 离线翻译与本机语音。构建需要 cmake 与 libclang;
# 只对 macOS / Windows / Android 生效 (见下方依赖表); 关掉它 (--no-default-features) 得到不带引擎的包。
local-llm = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
# Windows 用显卡 (Vulkan); 构建机要装 Vulkan SDK, 默认不开。macOS (Apple 芯片) 自带 Metal, 不需要它。
local-llm-vulkan = ["local-llm", "llama-cpp-2/vulkan"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api: 摸鱼模式的透明窗口 (tauri.conf.json app.macOSPrivateApi)
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", features = ["socks"] }
# 同步上传命令 (http_upload.rs); 与 tauri-plugin-http 用同一个 reqwest, 特性是其子集, 不重复编译
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "socks", "stream"] }
# 上传时从磁盘流式读书 (http_upload.rs), 内存与文件大小无关
tokio-util = { version = "0.7", features = ["io"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.32"
sha2 = "0.10.9"
# 导入时分块写书 (library_files.rs): 安卓 IPC 上 base64 比 JSON 数字数组小 3 倍多
base64 = "0.22"
crc32fast = "1.5"
flate2 = "1.1"
# TXT → EPUB 原生转换 (txt_epub.rs): 与前端 TextDecoder 同为 WHATWG 编码规范
encoding_rs = "0.8"
regex = "1"
# 导入 EPUB 取元数据 (epub_meta.rs), 与 foliate 的 DOMParser 对齐
roxmltree = "0.20"
uuid = { version = "1.20.0", features = ["v4"] }
libc = "0.2"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time", "fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
fontdb = "0.23"

# cargo_metadata 0.19.2 only raised its manifest MSRV to 1.78; its code still
# compiles on Tauri's declared 1.77.2 floor. Keep the tiny local patch until
# upstream Tauri no longer enables this transitive build dependency.
[patch.crates-io]
cargo_metadata = { path = "vendor/cargo_metadata" }

# 本地离线语音仅桌面平台 (sherpa-onnx 无移动端预编译库)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sherpa-onnx = "1.13.3"
# CBR → CBZ 桌面原生解包 (comic.rs); UnRAR 与前端 node-unrar-js 同源, 许可随包分发
unrar = "0.5"
ureq = "2"
bzip2 = "0.5.2"
tar = "0.4.46"
tauri-plugin-single-instance = "2"
# 摸鱼模式老板键 (stealth.rs)
tauri-plugin-global-shortcut = "2"

# 本机模型引擎 llama.cpp (src/local_llm), 只进 macOS / Windows / Android (与 build.rs 的 llm_engine 一致;
# Linux 桌面与 sherpa-onnx 的静态库冲突, iOS 未验证, 原因见 src/local_llm/mod.rs)。
# 版本固定: 绑定的 C 接口随 llama.cpp 变, 升级要重跑真实模型测试。mtmd 含实验性的语音生成接口 (Qwen3-TTS)。
# 不用 openmp (少一个运行库依赖, 用 llama.cpp 自己的线程池)。macOS (Apple 芯片) 自动带 Metal。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["mtmd"], optional = true }
# 语音生成 (local_llm/tts.rs) 直接用底层接口: 安全封装不暴露它需要的指针
llama-cpp-sys-2 = { version = "=0.1.161", default-features = false, features = ["mtmd"], optional = true }

# Android: C++ 运行库静态链接, APK 里不用再带 libc++_shared.so
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["mtmd", "android-static-stdcxx"], optional = true }
llama-cpp-sys-2 = { version = "=0.1.161", default-features = false, features = ["mtmd", "static-stdcxx"], optional = true }

# iOS 原生壳 (Swift), 与 Android 的 MainActivity.kt 对应
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-lightread-shell = { path = "plugins/ios-shell" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Wdk_System_SystemServices"] }
# SAPI 5 语音 (sapi_tts.rs): windows-sys 不含 COM 接口
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_SystemInformation", "Win32_UI_Shell"] }

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
