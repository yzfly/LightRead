name: Release (desktop)

# 桌面版 (Windows / macOS / Linux) 发版: tag vX.Y.Z, 版本取 package.json / tauri.conf.json / Cargo。
# App (Android / iOS) 走 app-vX.Y.Z + release-mobile.yml, 两条线版本号各自递增 (2026-10-25)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '桌面版本 tag (vX.Y.Z)；构建并续建它的草稿，全部平台验证通过后公开为 latest。留空则构建当前 ref'
        required: false
        default: ''

permissions:
  contents: write

# 同一版本只允许一个构建流程，避免资产与校验清单交叉覆盖。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    # 本地发版先设仓库变量 RELEASE_BUILD_MODE=manual；推 tag 不启动重复构建，改用 workflow_dispatch。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RELEASE_BUILD_MODE != 'manual' }}
    runs-on: ubuntu-22.04
    steps:
      # 审核策略来自本次 workflow 的固定 SHA；目标旧 tag 不必自带新版脚本。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: 保存当前发版审核脚本
        run: cp scripts/check-release.mjs scripts/apk-layout.mjs "$RUNNER_TEMP/"
      - name: 检出需要审核和构建的目标版本
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验桌面版本与 tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::桌面版 tag 必须是 vX.Y.Z；App 用 app-vX.Y.Z + release-mobile.yml"; exit 1; }
          node "$RUNNER_TEMP/check-release.mjs" --self-test
          node "$RUNNER_TEMP/check-release.mjs" --platform desktop --tag "$RELEASE_TAG"

      - run: npm ci
      - name: 验证书源、EPUB、听书、更新、书摘与平台边界回归
        run: |
          npm run test:book-sources
          npm run test:epub-compat
          npm run test:tts
          npm run test:updater
          npm run test:cover-repair
          npm run test:about-links
          npm run test:notes-export
          npm run test:quote-card
          npm run check:style-tokens
          node --experimental-strip-types --test scripts/test-mobile-updater.mjs scripts/test-platform-boundary.mjs
      - name: 在构建前准备 Release 草稿
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            # 重跑只续建草稿，避免直接替换已公开版本的部分安装包。
            test "$(cat "$RUNNER_TEMP/release-is-draft")" = true || { echo "::error::该版本已公开，请发布新版本"; exit 1; }
          else
            git log -1 --format=%B > "$RUNNER_TEMP/release-notes.txt"
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi

  desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 包不在这里构建: 签名证书只在 jiangshuMac 的钥匙串里, 由 scripts/build-macos-signed.sh
          # 在那台机器上签名、公证后上传到草稿, 下面的 macos-signed job 校验。
          - platform: windows-latest
            # WiX/MSI 在包含多种文件关联时会稳定失败；NSIS 同样是原生安装器且兼容这些关联。
            args: '--bundles nsis'
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # sherpa-onnx-sys stores downloaded native libraries beside Cargo's
          # target output, but Rust cache pruning can restore only the build
          # metadata and leave those libraries missing at the final link step.
          cache-targets: false

      - run: npm ci

      - name: 验证桌面拖放与文件夹导入
        run: |
          npm run test:native-drop
          npm run test:folder-pick
          cargo test --locked --manifest-path src-tauri/Cargo.toml library_import

      - name: 验证论文 Agent 前端契约
        run: npm run test:paper-agent

      - name: 验证论文 Agent 原生契约
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml agent

      - name: 验证后台进程无控制台启动与输出管道
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml background_process

      - name: 验证离线语音后台调度与错误传播
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml local_tts::desktop::tests::engine_task

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: '${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ${{ github.event.head_commit.message }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Linux 独立并行构建；最终 publish 等待全部平台与 Rust 最低版本检查。
  desktop-linux:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev cmake rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false

      - run: npm ci

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: '${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ${{ github.event.head_commit.message }}
          releaseDraft: true
          prerelease: false

  rust-floor:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev cmake
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 检查声明的 Rust 最低版本
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  # macOS 包必须是 Developer ID 签名 + Apple 公证 + 装订票据。只有链接器自带签名的包, 浏览器下载后在
  # Apple 芯片 Mac 上报「已损坏」且无法放行 (issue #20, v2.10.1 及更早都是这样)。这里不构建, 只校验
  # 已上传到草稿的两个 DMG; 缺包或校验不过, 草稿不会公开。
  macos-signed:
    needs: preflight
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TEAM_ID: 3HNKBKJ59V
    steps:
      - name: 校验 macOS 安装包的签名与公证
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          mkdir dmg && cd dmg
          gh release download "$RELEASE_TAG" -p "LightRead_${version}_aarch64.dmg" -p "LightRead_${version}_x64.dmg" \
            || { echo "::error::草稿里没有 macOS 安装包: 先在 jiangshuMac 运行 scripts/build-macos-signed.sh 并上传两个 DMG"; exit 1; }
          # 输出先收进变量再匹配: 直接接 grep -q 会让上游吃 SIGPIPE, pipefail 下误判失败。
          has() { local out; out=$("${@:2}" 2>&1) || true; printf '%s\n' "$out" >&2; [[ $out == *"$1"* ]]; }
          for pair in aarch64:arm64 x64:x86_64; do
            suffix=${pair%%:*}; arch=${pair##*:}
            dmg="LightRead_${version}_${suffix}.dmg"
            test -f "$dmg" || { echo "::error::缺少 $dmg"; exit 1; }
            # 模拟浏览器下载: 带隔离标记后再评估。
            xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;$(uuidgen)" "$dmg"
            xcrun stapler validate "$dmg"
            has 'source=Notarized Developer ID' spctl -a -t open --context context:primary-signature -vv "$dmg"
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            app="$mnt/LightRead.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            has "TeamIdentifier=$TEAM_ID" codesign -dvv "$app"
            xcrun stapler validate "$app"
            has 'source=Notarized Developer ID' spctl -a -t exec -vv "$app"
            test "$(lipo -archs "$app/Contents/MacOS/lightread")" = "$arch"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
            hdiutil detach "$mnt" >/dev/null
            echo "✓ $dmg"
          done

  publish:
    needs: [desktop, desktop-linux, rust-floor, macos-signed]
    # 全部桌面平台、macOS 签名校验与 Rust 最低版本检查成功后才公开草稿。
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.desktop-linux.result == 'success' && needs.rust-floor.result == 'success' && needs.macos-signed.result == 'success' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 下载并核对 Release 资产，生成完整 SHA256 清单
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --skip-existing
          cd release-assets
          compgen -G '*_aarch64.dmg' >/dev/null
          compgen -G '*_x64.dmg' >/dev/null
          compgen -G '*-setup.exe' >/dev/null
          compgen -G '*.AppImage' >/dev/null
          compgen -G '*.deb' >/dev/null
          # 桌面 Release 不带 APK: 已安装的 App 会采用任何带 APK 的 vX.Y.Z, 混入会把桌面版本推给 App 用户。
          ! compgen -G '*.apk' >/dev/null || { echo "::error::桌面 Release 不能包含 APK"; exit 1; }
          # 不把旧清单包含进新清单，也不删除已上传的安装包。
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
      - name: 全部平台验证完成后公开为 latest
        run: gh release edit "$RELEASE_TAG" --draft=false --title "$RELEASE_TAG" --latest

  # 国内镜像（GitCode）：仅在 publish 成功后运行，只读 GitHub Release；未配置 GITCODE_TOKEN 时内部跳过。
  # 失败不会撤回或修改 GitHub Release，可在 Actions → Mirror to GitCode 手动补跑。见 docs/gitcode-mirror.md。
  mirror-gitcode:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/mirror-gitcode.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
